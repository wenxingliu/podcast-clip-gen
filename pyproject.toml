[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-clips"
version = "0.1.0"
description = "Local transcript-guided podcast clipping and branded audiogram rendering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "PyYAML>=6.0"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
podcast-clips = "podcast_shorts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

